name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/keen-shannon-85rbj0"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyinstaller pytest -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Build executable
        run: pyinstaller packaging/gx_keybinds.spec --noconfirm --clean
      - name: Build installer
        shell: pwsh
        run: |
          $ver = python -c "import gx_keybinds;print(gx_keybinds.__version__)"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" packaging\installer.iss
      - name: Portable zip (sin instalar, para copiar a otros equipos)
        shell: pwsh
        run: |
          $ver = python -c "import gx_keybinds;print(gx_keybinds.__version__)"
          Compress-Archive -Path dist\GxKeybinds -DestinationPath "dist\GxKeybinds-portable-$ver.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: GxKeybinds-Setup
          path: dist/GxKeybinds-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: GxKeybinds-Portable
          path: dist/GxKeybinds-portable-*.zip
